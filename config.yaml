# WhatsApp Emulator Configuration
# Environment variables override these values where noted.

user:
  phone: "+1234567890"        # env: USER_PHONE
  name: "You"                 # env: USER_NAME

bot:
  name: "Bot"                 # env: BOT_NAME
  phone_number_id: "15551234567"  # env: WHATSAPP_PHONE_NUMBER_ID

# Optional: explicit session ID. If omitted, derived deterministically from user.phone.
# session_id: "my-custom-session-id"

server:
  ui_port: 3000               # env: UI_PORT
  emulator_port: 4004         # env: EMULATOR_PORT

webhook:
  url: "http://localhost:8000/api/whatsapp/webhook"  # env: WEBHOOK_URL
  verify_token: "test-verify-token"                  # env: WHATSAPP_VERIFY_TOKEN
  # app_secret: "optional"                           # env: WHATSAPP_WEBHOOK_SECRET
  # reset_session_url: "http://localhost:8000/api/reset-session"  # env: RESET_SESSION_URL

  # Paths on the webhook URL's origin probed (in order, first 2xx wins) to check the
  # backend is up before each text send. The env var takes a comma-separated list.
  # health_paths: ["/health", "/api/health"]         # env: HEALTH_PATHS

storage:
  # SQLite database path (relative to package root)
  db_path: "data/messages.db"

  # Folder for files the bot sends (images, documents, audio, video).
  # Defaults to a "media" folder next to the database.
  # media_dir: "data/media"      # env: MEDIA_DIR

  # Largest file accepted, in MB (applies to uploads and downloaded links)
  # media_max_mb: 100            # env: MEDIA_MAX_MB

# WhatsApp Flows: the Flow JSON to render for each flow_id (or flow_name) a
# Flow message names. Paths resolve from the working directory; a file is read
# each time its Flow is opened, so edits apply without a restart. A Flow with
# no entry here is answered with a raw JSON editor instead.
# env: FLOWS="my-flow-id=flows/my_flow.json,other-id=flows/other.json" (per id, over this map)
# flows:
#   my-flow-id: "flows/my_flow.json"
